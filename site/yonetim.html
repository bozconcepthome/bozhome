<!doctype html>
<html lang="tr">

<body class="panel-body">
  <div class="panel-app">
    <aside class="side">
      <a class="logo" href="index.html" title="Siteyi aç"><span class="mark">Boz</span><span class="word">Yönetim</span></a>
      <nav class="side-nav" id="side-nav" aria-label="Panel bölümleri">
        <button type="button" data-sekme="genel" aria-current="page"><span class="i">◎</span>Genel bakış</button>
        <button type="button" data-sekme="urunler"><span class="i">▦</span>Ürünler</button>
        <button type="button" data-sekme="ayarlar"><span class="i">⚙</span>Mağaza ayarları</button>
        <button type="button" data-sekme="siparisler"><span class="i">☰</span>Siparişler</button>
        <button type="button" data-sekme="yayinla"><span class="i">↑</span>Yayınla <span class="pill" id="nav-degisiklik" hidden></span></button>
      </nav>
      <p class="side-note">Değişiklikler önce taslak olarak bu tarayıcıda tutulur. <b>Yayınla</b> adımıyla siteye aktarılır.</p>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="baslik">Genel bakış</h1>
          <p class="sub" id="durum"></p>
        </div>
        <div class="top-actions">
          <a class="btn btn-ghost" id="onizle" href="index.html?taslak=1" target="_blank" rel="noopener">Sitede önizle</a>
          <button class="btn btn-primary" type="button" data-git="yayinla">Yayınla</button>
        </div>
      </header>
      <main id="icerik" class="content"></main>
    </div>
  </div>

  <aside class="edit" id="edit" role="dialog" aria-modal="true" aria-labelledby="edit-baslik" hidden>
    <div class="edit-head">
      <h2 id="edit-baslik">Ürünü düzenle</h2>
      <button class="icon-btn" type="button" id="edit-kapat" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="edit-body" id="edit-body"></div>
  </aside>
  <div class="overlay" id="edit-perde"></div>
  <div class="toast" role="status" aria-live="polite"><span id="toast-msg"></span></div>

  <script src="assets/js/data.js"></script>
